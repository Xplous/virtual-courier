explore_node:
  ros__parameters:
    use_sim_time: true
    robot_base_frame: base_link
    costmap_topic: /exploration_map
    costmap_updates_topic: /exploration_map_updates
    visualize: true
    planner_frequency: 1.0
    progress_timeout: 30.0
    potential_scale: 3.0
    orientation_scale: 2.0
    goal_switch_margin: 1.0
    gain_scale: 1.0
    transform_tolerance: 0.3
    min_frontier_size: 0.75
    return_to_init: false
